<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>套餐与积分 - CreatiAds</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="logo">CreatiAds Admin</div>
            <div class="context-switcher">
                <span class="context-label">当前组织：</span>
                <select id="orgSelector" onchange="switchOrg(this.value)">
                    <!-- 动态渲染 -->
                </select>
            </div>
        </div>
        <div class="top-bar-right">
            <select id="userSwitcher" onchange="switchUser(this.value)" title="演示用：切换当前登录用户">
                <!-- 动态渲染 -->
            </select>
        </div>
    </header>

    <div class="main-container">
        <!-- 左侧菜单 -->
        <aside class="sidebar">
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-page="overview" onclick="navigateTo('overview')">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                    </span>
                    <span class="nav-text">概览</span>
                </a>
                <a href="#" class="nav-item" data-page="history" onclick="navigateTo('history')">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                    </span>
                    <span class="nav-text">账单历史</span>
                </a>
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <main class="content-area">
            <!-- ===== 概览页 ===== -->
            <div id="overviewPage" class="page-content active">
                <div class="page-header">
                    <div>
                        <h1>套餐与积分</h1>
                    </div>
                </div>

                <!-- 当前套餐 + 用量统计（合并模块） -->
                <div class="billing-plan-module">
                    <div class="billing-plan-card" id="billingPlanCard">
                        <!-- 动态渲染 -->
                    </div>
                    <div class="billing-plan-usage">
                        <div class="billing-plan-usage-title">用量统计</div>
                        <div class="billing-usage-grid" id="billingUsageGrid">
                            <!-- 动态渲染 -->
                        </div>
                    </div>
                </div>

                <!-- 套餐对比 -->
                <div class="billing-card">
                    <div class="section-title-row">
                        <h3 class="section-title">套餐对比</h3>
                    </div>
                    <div class="plan-comparison" id="planComparison">
                        <!-- 动态渲染 -->
                    </div>
                </div>

                <!-- Add-ons 加购项 -->
                <div class="billing-card">
                    <h3 class="section-title">Add-ons · 按需加购</h3>
                    <p class="section-desc" style="color:#6b7280;font-size:13px;margin:-8px 0 16px;">主套餐门槛低 + 深度用户按需付费，客单价灵活拉升</p>
                    <div class="addon-grid" id="addonGrid">
                        <!-- 动态渲染 -->
                    </div>
                </div>
            </div>

            <!-- ===== 账单历史页 ===== -->
            <div id="historyPage" class="page-content" style="display:none;">
                <div class="page-header">
                    <div>
                        <h1>账单历史</h1>
                    </div>
                </div>

                <div class="billing-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>账期</th>
                                <th>类型</th>
                                <th>金额</th>
                                <th>支付方式</th>
                                <th>状态</th>
                                <th style="width:100px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="billingTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== 升级套餐弹窗 ===== -->
    <div class="modal-overlay drawer-overlay" id="upgradeModal" style="display:none;">
        <div class="modal drawer">
            <div class="modal-header">
                <h3 id="upgradeModalTitle">升级套餐</h3>
                <button class="modal-close" onclick="closeUpgradeModal()">&times;</button>
            </div>
            <div class="modal-body" id="upgradeModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeUpgradeModal()">取消</button>
                <button class="btn btn-primary" id="upgradeConfirmBtn" onclick="confirmUpgrade()">确认支付</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
